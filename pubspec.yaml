name: weather_app
description: "Weather app for personal use"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.11.1

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_gen: ^5.7.0
  flutter_svg: ^2.0.10+1
  go_router: ^14.2.8
  http: ^1.2.2
  intl: ^0.19.0
  hive: ^2.2.3
  stream_transform: ^2.1.0

  isar: 4.0.0-dev.14
  isar_flutter_libs: ^4.0.0-dev.14
  path_provider: ^2.1.4
  cached_network_image: ^3.4.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  flutter_gen_runner: any
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter_gen:
  output: lib/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
