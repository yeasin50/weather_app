name: weather_app
description: "Weather app for personal use"
publish_to: "none"
version: 0.1.0

isar_version: &isar_version 3.3.2

environment:
  sdk: ^3.11.1

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_gen: ^5.7.0
  flutter_svg: ^2.0.10+1
  go_router: ^18.0.1
  http: ^1.2.2
  intl: ^0.20.3
  stream_transform: ^2.1.0

  path_provider: ^2.1.4
  cached_network_image: ^4.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  provider: ^6.1.5+1

  isar_community: 
    version: *isar_version
  isar_community_flutter_libs: 
    version: *isar_version


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  flutter_gen_runner: any
  freezed: any
  json_serializable: ^6.8.0
  isar_community_generator: 
    version: *isar_version

flutter_gen:
  output: lib/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
